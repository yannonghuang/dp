# Prod: no source mounts, production build and commands
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build

services:
  backend:
    volumes:
      - ./data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      target: runner
    volumes: []
    environment:
      - NODE_ENV=production
