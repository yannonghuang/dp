# Dev (default): local mounts + hot reload
# Run: docker compose up --build

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - ./output:/output:ro
    environment:
      - DATA_DIR=/data
      - LINKAGE_PATH=/output/linkage_report.csv
      - OPENAI_API_KEY=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
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      #- frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy

